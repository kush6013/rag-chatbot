services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────────────
  - type: web
    name: rag-chatbot
    runtime: python
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false          # Set this manually in the Render dashboard
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_FALLBACK_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: FRONTEND_URL
        value: https://rag-frontend-q1zq.onrender.com
      - key: ALLOWED_ORIGINS
        value: http://127.0.0.1:5500,http://localhost:5500,https://rag-frontend-q1zq.onrender.com

  # NOTE: Static sites are NOT supported in render.yaml Blueprints.
  # Create the frontend static site manually in the Render dashboard:
  #   - Type: Static Site
  #   - Repo: kush6013/rag-chatbot
  #   - Branch: main
  #   - Root Directory: frontend
  #   - Build Command: (leave empty)
  #   - Publish Directory: ./
